<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrícula — Portal Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main>
    <h1>Matrícula</h1>
    <p class="eyebrow">Informe o código da disciplina para se matricular.</p>

    <form id="form-matricula">
      <div>
        <label for="disciplina_id">ID da disciplina</label>
        <input type="number" id="disciplina_id" required>
      </div>
      <div id="mensagem" class="mensagem"></div>
      <button type="submit" class="btn">Matricular</button>
    </form>

    <h2 style="margin-top:2rem">Minhas matrículas</h2>
    <div id="lista-matriculas"><p>Carregando...</p></div>
  </main>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    exigirLogin();
    montarNavegacao('matricula.html');

    async function carregarMatriculas() {
      const el = document.getElementById('lista-matriculas');
      try {
        const { matriculas } = await api.minhasMatriculas();
        el.innerHTML = matriculas.length
          ? `<table><thead><tr><th>Disciplina</th><th>Status</th></tr></thead><tbody>
              ${matriculas.map(m => `<tr><td>${m.disciplina_nome}</td><td>${m.status}</td></tr>`).join('')}
             </tbody></table>`
          : '<p>Nenhuma matrícula ainda.</p>';
      } catch (erro) {
        el.innerHTML = `<p>${erro.message}</p>`;
      }
    }

    document.getElementById('form-matricula').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensagem = document.getElementById('mensagem');
      mensagem.className = 'mensagem';

      try {
        await api.matricular(Number(document.getElementById('disciplina_id').value));
        mensagem.textContent = 'Matrícula realizada com sucesso!';
        mensagem.className = 'mensagem sucesso';
        document.getElementById('form-matricula').reset();
        carregarMatriculas();
      } catch (erro) {
        mensagem.textContent = erro.message;
        mensagem.className = 'mensagem erro';
      }
    });

    carregarMatriculas();
  </script>
</body>
</html>

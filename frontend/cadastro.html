<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro — Portal Acadêmico</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main style="padding-top:3rem">
    <h1>Criar conta</h1>
    <p class="eyebrow">Cadastre-se para acessar o portal acadêmico.</p>

    <form id="form-cadastro">
      <div>
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" required>
      </div>
      <div>
        <label for="email">Email</label>
        <input type="email" id="email" required>
      </div>
      <div>
        <label for="senha">Senha</label>
        <input type="password" id="senha" minlength="6" required>
      </div>
      <div>
        <label for="tipo">Você é</label>
        <select id="tipo">
          <option value="aluno">Aluno</option>
          <option value="professor">Professor</option>
        </select>
      </div>
      <div id="mensagem" class="mensagem"></div>
      <button type="submit" class="btn">Cadastrar</button>
    </form>

    <p style="margin-top:1.5rem; font-size:0.9rem;">
      Já tem conta? <a href="index.html">Entrar</a>
    </p>
  </main>

  <script src="js/api.js"></script>
  <script>
    document.getElementById('form-cadastro').addEventListener('submit', async (e) => {
      e.preventDefault();
      const mensagem = document.getElementById('mensagem');
      mensagem.className = 'mensagem';

      try {
        await api.cadastrar({
          nome: document.getElementById('nome').value,
          email: document.getElementById('email').value,
          senha: document.getElementById('senha').value,
          tipo: document.getElementById('tipo').value,
        });
        mensagem.textContent = 'Conta criada! Redirecionando para o login...';
        mensagem.className = 'mensagem sucesso';
        setTimeout(() => (window.location.href = 'index.html'), 1200);
      } catch (erro) {
        mensagem.textContent = erro.message;
        mensagem.className = 'mensagem erro';
      }
    });
  </script>
</body>
</html>
